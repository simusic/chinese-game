// Profile Management
let currentProfile = null;

const MAX_STARS = 6;
const ALL_LEVELS = ['K1', 'K2', 'K3', 'P1', 'P2', 'P3', 'P4', 'P5', 'P6', 'F1'];

// Levels that are permanently mastered for a given child.
const GUARANTEED_STARS = {
    Hugo:   { K1: 6, K2: 6, K3: 6, P1: 6 },
    Sophie: { K1: 3 }
};

function freshGameState() {
    const s = { currentLevel: 'K1', totalStars: 0 };
    ALL_LEVELS.forEach(l => { s[l] = { stars: 0, sublevel: 1 }; });
    return s;
}

// Applies the floor of guaranteed stars for a profile. Progress can go up
// from here, never below.
function applyGuaranteedStars(state, profileName) {
    const floors = GUARANTEED_STARS[profileName];
    if (!floors) return state;
    Object.keys(floors).forEach(lvl => {
        if (!state[lvl]) state[lvl] = { stars: 0, sublevel: 1 };
        if ((state[lvl].stars || 0) < floors[lvl]) {
            state[lvl].stars = floors[lvl];
        }
    });
    return state;
}

function selectProfile(profileName) {
    currentProfile = profileName;
    localStorage.setItem('currentProfile', profileName);
    document.getElementById('profileSelector').style.display = 'none';
    document.getElementById('mainGame').style.display = 'block';
    document.getElementById('currentProfile').textContent = `👤 ${profileName}`;

    // Always start from a clean slate so one child's progress can never
    // leak into the other's when switching profiles.
    gameState = freshGameState();
    loadGameState();
    loadSoundSettings();

    // Pull the newest progress from the cloud if a sync code is set up.
    cloudPull({ silent: true });
}

function switchProfile() {
    document.getElementById('mainGame').style.display = 'none';
    document.getElementById('profileSelector').style.display = 'block';
    currentProfile = null;
    localStorage.removeItem('currentProfile');
}

function getStorageKey(key) {
    return `${currentProfile}_${key}`;
}

let gameState = {
    currentLevel: 'K1', totalStars: 0,
    K1: { stars: 0, sublevel: 1 }, K2: { stars: 0, sublevel: 1 }, K3: { stars: 0, sublevel: 1 },
    P1: { stars: 0, sublevel: 1 }, P2: { stars: 0, sublevel: 1 }, P3: { stars: 0, sublevel: 1 },
    P4: { stars: 0, sublevel: 1 }, P5: { stars: 0, sublevel: 1 }, P6: { stars: 0, sublevel: 1 },
    F1: { stars: 0, sublevel: 1 }
};

let currentSession = {
    level: 'K1', questionIndex: 0, sessionCorrect: 0, sessionWrong: 0,
    questions: [], currentQuestion: null, answered: false, answers: []
};

function loadGameState() {
    const saved = localStorage.getItem(getStorageKey('chineseGameState'));
    if (saved) {
        try { gameState = JSON.parse(saved); }
        catch (e) { gameState = freshGameState(); }
    } else {
        gameState = freshGameState();
    }

    // Repair any missing levels from older saves.
    ALL_LEVELS.forEach(l => {
        if (!gameState[l]) gameState[l] = { stars: 0, sublevel: 1 };
        if (gameState[l].stars > MAX_STARS) gameState[l].stars = MAX_STARS;
    });
    if (!gameState.currentLevel) gameState.currentLevel = 'K1';
    // A previous click may have parked us on a level with no words yet.
    const cur = characterDatabase[gameState.currentLevel];
    if (!cur || cur.length < 4) gameState.currentLevel = 'K1';

    applyGuaranteedStars(gameState, currentProfile);
    updateRPGDisplay();
}

function saveGameState() {
    if (!currentProfile) return;
    applyGuaranteedStars(gameState, currentProfile);
    gameState.updatedAt = Date.now();
    localStorage.setItem(getStorageKey('chineseGameState'), JSON.stringify(gameState));
    cloudPushDebounced();
}

function updateRPGDisplay() {
    const level = gameState.currentLevel;
    if (!gameState[level]) { gameState[level] = { stars: 0, sublevel: 1 }; }
    
    const sublevel = gameState[level].sublevel;
    const stars = gameState[level].stars;
    
    gameState.totalStars = ALL_LEVELS.reduce((sum, key) => {
        const d = gameState[key];
        return sum + (d && d.stars ? d.stars : 0);
    }, 0);
    
    // Update level buttons with progress indicators
    updateLevelButtons();
}

function updateLevelButtons() {
    const levels = ['K1', 'K2', 'K3', 'P1', 'P2', 'P3', 'P4', 'P5', 'P6', 'F1'];
    const icons = ['🌈', '🎨', '🎯', '📖', '📝', '🎓', '✏️', '🖊️', '🖍️', '🏆'];
    const wordCounts = [110, 120, 130, 140, 150, 160, 170, 180, 190, 200];
    
    levels.forEach((levelCode, index) => {
        const btn = document.querySelector(`.level-btn.${levelCode.toLowerCase()}`);
        if (!btn) return;
        
        const levelData = gameState[levelCode];
        const raw = levelData && levelData.stars ? levelData.stars : 0;
        const stars = Math.max(0, Math.min(MAX_STARS, raw));
        
        // Create star display: filled stars + empty stars (total 6)
        const filledStars = '⭐'.repeat(stars);
        const emptyStars = '☆'.repeat(MAX_STARS - stars);
        const starsDisplay = filledStars + emptyStars;

        const pool = characterDatabase[levelCode];
        const ready = pool && pool.length >= 4;

        if (ready) {
            btn.classList.remove('locked');
            btn.innerHTML = `
                <div style="font-size: 1.1em; font-weight: bold;">${icons[index]} ${levelCode} ${starsDisplay}</div>
                <small style="font-size: 0.7em;">${wordCounts[index]} words</small>
            `;
        } else {
            btn.classList.add('locked');
            btn.innerHTML = `
                <div style="font-size: 1.1em; font-weight: bold;">🔒 ${levelCode}</div>
                <small style="font-size: 0.7em;">即將推出 Coming soon</small>
            `;
        }
    });
}

function showToast(message) {
    const existing = document.getElementById('gameToast');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.id = 'gameToast';
    toast.className = 'game-toast';
    toast.innerHTML = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2600);
}

function selectLevel(level) {
    const pool = characterDatabase[level];
    if (!pool || pool.length < 4) {
        showToast(`🔒 ${level} 字詞仍在準備中<br><small>${level} is coming soon</small>`);
        return;
    }
    gameState.currentLevel = level;
    saveGameState();
    updateRPGDisplay();
    startSession();
}

function returnToMenu() {
    document.getElementById('gameContainer').style.display = 'none';
    document.getElementById('levelSelector').style.display = 'block';
    saveGameState();
}


function buildGameShell() {
    const progressHtml = Array.from({length: 10}, (_, i) => 
        `<div class="question-dot ${i === 0 ? 'current' : ''}">${i + 1}</div>`
    ).join('');

    document.getElementById('gameContainer').innerHTML = `
        <div class="nav-bar">
            <button class="nav-btn" onclick="returnToMenu()">🏠 返回主選單<br>Back to Menu</button>
            <button class="nav-btn" onclick="showWordList()">📚 字詞表<br>Word List</button>
        </div>
        <div class="session-progress" id="sessionProgress">${progressHtml}</div>
        <div class="score-board">
            <div class="score-item"><div>✅ 正確</div><span class="score-number" id="sessionCorrect">0</span></div>
            <div class="score-item"><div>❌ 錯誤</div><span class="score-number" id="sessionWrong">0</span></div>
        </div>
        <div class="question-box"><div id="questionDisplay"></div></div>
        <div class="options-grid" id="optionsGrid"></div>
    `;
}

function startSession() {
    const level = gameState.currentLevel;
    const pool = characterDatabase[level];

    if (!pool || pool.length < 4) {
        showToast(`🔒 ${level} 字詞仍在準備中<br><small>${level} is coming soon</small>`);
        document.getElementById('gameContainer').style.display = 'none';
        document.getElementById('levelSelector').style.display = 'block';
        return;
    }

    currentSession = {
        level: level, questionIndex: 0, sessionCorrect: 0, sessionWrong: 0,
        questions: [], currentQuestion: null, answered: false, answers: []
    };

    currentSession.questions = shuffleArray([...pool]).slice(0, 10);

    document.getElementById('levelSelector').style.display = 'none';
    document.getElementById('gameContainer').style.display = 'block';

    // Rebuild the shell every time — the results screen replaces it,
    // so the question elements may not exist any more.
    buildGameShell();

    loadQuestion();
}

function shuffleArray(array) {
    const newArray = [...array];
    for (let i = newArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
    }
    return newArray;
}

function loadQuestion() {
    if (currentSession.questionIndex >= 10) {
        showSessionResults();
        return;
    }
    
    currentSession.answered = false;
    currentSession.currentQuestion = currentSession.questions[currentSession.questionIndex];
    
    document.getElementById('sessionCorrect').textContent = currentSession.sessionCorrect;
    document.getElementById('sessionWrong').textContent = currentSession.sessionWrong;
    
    const charLen = currentSession.currentQuestion.char.length;
    const fontSize = charLen <= 2 ? '4em' : charLen === 3 ? '3em' : '2.5em';
    document.getElementById('questionDisplay').innerHTML = 
        `<div class="character-display" style="font-size: ${fontSize}" onclick="speakCantonese('${currentSession.currentQuestion.char}')" title="點擊聽發音 Click to hear pronunciation">${currentSession.currentQuestion.char}<span class="speaker-icon">🔊</span></div>`;
    
    generateOptions();
    updateSessionProgress();
}

function generateOptions() {
    const allChars = characterDatabase[currentSession.level];
    const wrongOptions = [];
    const usedChars = new Set([currentSession.currentQuestion.char]);
    const usedMeanings = new Set([currentSession.currentQuestion.meaning]);
    
    while (wrongOptions.length < 4) {
        const randomChar = allChars[Math.floor(Math.random() * allChars.length)];
        if (!usedChars.has(randomChar.char) && !usedMeanings.has(randomChar.meaning)) {
            wrongOptions.push(randomChar);
            usedChars.add(randomChar.char);
            usedMeanings.add(randomChar.meaning);
        }
    }
    
    const allOptions = shuffleArray([currentSession.currentQuestion, ...wrongOptions]);
    
    document.getElementById('optionsGrid').innerHTML = allOptions.map(option => `
        <div class="option-card" onclick="selectOption(this, '${option.char}')">
            <div class="option-icon">${option.icon}</div>
            <div class="option-text">${option.meaning}</div>
        </div>
    `).join('');
}

function selectOption(card, selectedChar) {
    if (currentSession.answered) return;
    
    currentSession.answered = true;
    const isCorrect = selectedChar === currentSession.currentQuestion.char;
    
    currentSession.answers[currentSession.questionIndex] = isCorrect;
    
    if (isCorrect) {
        card.classList.add('correct');
        currentSession.sessionCorrect++;
        showFeedback('🎉');
        playSuccessSound(); // Play uplifting chime!
    } else {
        card.classList.add('wrong');
        currentSession.sessionWrong++;
        showFeedback('❌');
        playWrongSound(); // Play wrong answer sound
        
        document.querySelectorAll('.option-card').forEach(c => {
            if (c.querySelector('.option-text').textContent === currentSession.currentQuestion.meaning) {
                c.classList.add('correct');
            }
        });
    }
    
    document.getElementById('sessionCorrect').textContent = currentSession.sessionCorrect;
    document.getElementById('sessionWrong').textContent = currentSession.sessionWrong;
    updateSessionProgress();
    
    setTimeout(() => {
        currentSession.questionIndex++;
        loadQuestion();
    }, 500);
}

function updateSessionProgress() {
    document.querySelectorAll('.question-dot').forEach((dot, index) => {
        dot.className = 'question-dot';
        if (index < currentSession.questionIndex) {
            dot.classList.add(currentSession.answers[index] ? 'correct' : 'wrong');
        } else if (index === currentSession.questionIndex) {
            dot.classList.add('current');
        }
    });
}

function showFeedback(emoji) {
    const feedback = document.createElement('div');
    feedback.className = 'feedback';
    feedback.textContent = emoji;
    document.body.appendChild(feedback);
    setTimeout(() => feedback.remove(), 1000);
}

function showSessionResults() {
    const perfect = currentSession.sessionCorrect === 10;
    let starAwarded = false;
    
    const lvl = gameState[currentSession.level];

    if (perfect && lvl.stars < MAX_STARS) {
        starAwarded = true;
        lvl.stars++;

        if (lvl.stars >= MAX_STARS) {
            lvl.stars = MAX_STARS;
            setTimeout(() => showLevelUpAnimation(), 1500);
        }

        saveGameState();
        updateRPGDisplay();
    } else if (perfect) {

// Success Sound Effect - More hopeful and uplifting!
function playSuccessSound() {
    if (!soundSettings.enabled) return;
    
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    
    // Longer, more triumphant melody with 5 notes
    const notes = [
        { freq: 523.25, time: 0, duration: 0.12 },      // C5
        { freq: 659.25, time: 0.10, duration: 0.12 },   // E5
        { freq: 783.99, time: 0.20, duration: 0.15 },   // G5
        { freq: 1046.50, time: 0.32, duration: 0.18 },  // C6 - higher octave!
        { freq: 1318.51, time: 0.46, duration: 0.30 }   // E6 - triumphant finish!
    ];
    
    notes.forEach(note => {
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        
        // Triangle wave for a softer, more pleasant sound
        oscillator.type = 'triangle';
        oscillator.frequency.setValueAtTime(note.freq, audioContext.currentTime + note.time);
        
        // Envelope: quick attack, sustain, then fade out
        gainNode.gain.setValueAtTime(0, audioContext.currentTime + note.time);
        gainNode.gain.linearRampToValueAtTime(soundSettings.successVolume, audioContext.currentTime + note.time + 0.02);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + note.time + note.duration);
        
        oscillator.start(audioContext.currentTime + note.time);
        oscillator.stop(audioContext.currentTime + note.time + note.duration);
    });
}

// Wrong Answer Sound Effect - Longer and more noticeable
function playWrongSound() {
    if (!soundSettings.enabled) return;
    
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    
    // Two-tone descending sound
    const tones = [
        { freq: 350, time: 0, duration: 0.25 },
        { freq: 250, time: 0.22, duration: 0.35 }
    ];
    
    tones.forEach(tone => {
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        
        // Sine wave for a gentle tone
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(tone.freq, audioContext.currentTime + tone.time);
        oscillator.frequency.exponentialRampToValueAtTime(tone.freq * 0.8, audioContext.currentTime + tone.time + tone.duration);
        
        gainNode.gain.setValueAtTime(0, audioContext.currentTime + tone.time);
        gainNode.gain.linearRampToValueAtTime(soundSettings.wrongVolume, audioContext.currentTime + tone.time + 0.02);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + tone.time + tone.duration);
        
        oscillator.start(audioContext.currentTime + tone.time);
        oscillator.stop(audioContext.currentTime + tone.time + tone.duration);
    });
}

/* ============================================================
   ONLINE SYNC
   Progress for BOTH children is stored in one small JSON record
   on jsonblob.com, addressed by a "sync code" (the blob id).
   Enter the same code on every device and they stay in sync.
   ============================================================ */

const SYNC_API = 'https://jsonblob.com/api/jsonBlob';
let cloudPushTimer = null;
let cloudBusy = false;

function getSyncCode() {
    return localStorage.getItem('chineseGameSyncCode') || '';
}

function setSyncCode(code) {
    if (code) localStorage.setItem('chineseGameSyncCode', code);
    else localStorage.removeItem('chineseGameSyncCode');
}

function setSyncStatus(text) {
    const box = document.getElementById('syncStatusBox');
    if (box) box.innerHTML = text;
}

// Collect every profile's saved progress into one object.
function collectAllProfiles() {
    const bundle = { app: 'chinese-learning-game', savedAt: Date.now(), profiles: {} };
    ['Hugo', 'Sophie'].forEach(name => {
        const raw = localStorage.getItem(`${name}_chineseGameState`);
        if (raw) {
            try { bundle.profiles[name] = JSON.parse(raw); } catch (e) {}
        }
    });
    return bundle;
}

// Merge remote into local, keeping the HIGHER star count per level so a
// stale device can never wipe out progress earned somewhere else.
function mergeBundle(remote) {
    if (!remote || !remote.profiles) return false;
    let changed = false;

    ['Hugo', 'Sophie'].forEach(name => {
        const incoming = remote.profiles[name];
        if (!incoming) return;

        let local = {};
        try { local = JSON.parse(localStorage.getItem(`${name}_chineseGameState`) || '{}'); }
        catch (e) { local = {}; }

        const merged = Object.assign(freshGameState(), local);

        ALL_LEVELS.forEach(lvl => {
            const a = (local[lvl] && local[lvl].stars) || 0;
            const b = (incoming[lvl] && incoming[lvl].stars) || 0;
            const best = Math.min(MAX_STARS, Math.max(a, b));
            if (!merged[lvl]) merged[lvl] = { stars: 0, sublevel: 1 };
            if (merged[lvl].stars !== best) changed = true;
            merged[lvl].stars = best;
        });

        if ((incoming.updatedAt || 0) > (local.updatedAt || 0)) {
            merged.currentLevel = incoming.currentLevel || merged.currentLevel || 'K1';
        }
        merged.updatedAt = Math.max(local.updatedAt || 0, incoming.updatedAt || 0);

        applyGuaranteedStars(merged, name);
        localStorage.setItem(`${name}_chineseGameState`, JSON.stringify(merged));

        if (name === currentProfile) {
            gameState = merged;
            updateRPGDisplay();
        }
    });

    return changed;
}

async function createSyncCode() {
    setSyncStatus('⏳ 建立中… Creating…');
    try {
        const res = await fetch(SYNC_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(collectAllProfiles())
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);

        // The new blob's id comes back in the Location header.
        const loc = res.headers.get('Location') || res.headers.get('location') || '';
        const code = loc.split('/').pop();
        if (!code) throw new Error('no-id');

        setSyncCode(code);
        setSyncStatus(`✅ 已建立 Created<br><span style="color:#60a5fa; font-family: monospace; font-size:1.1em;">${code}</span>`);
        alert(`同步碼已建立！Sync code created:\n\n${code}\n\n請在其他設備的設定中輸入這個碼。\nEnter this code in Settings on your other devices.`);
    } catch (e) {
        setSyncStatus('❌ 建立失敗 Failed — 請檢查網絡 Check connection');
        alert('無法建立同步碼。Could not create sync code.\n\n請檢查網絡連接，或改用下面的檔案備份。\nCheck your internet, or use File Backup below.');
    }
}

async function connectSyncCode() {
    const input = document.getElementById('syncCodeInput');
    const code = input ? input.value.trim() : '';
    if (!code) { alert('請輸入同步碼 Please enter a sync code'); return; }

    setSyncStatus('⏳ 連接中… Connecting…');
    try {
        const res = await fetch(`${SYNC_API}/${encodeURIComponent(code)}`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const remote = await res.json();

        setSyncCode(code);
        mergeBundle(remote);
        await cloudPush(true);

        setSyncStatus(`✅ 已連接 Connected<br><span style="color:#60a5fa; font-family: monospace;">${code}</span>`);
        alert('連接成功！進度已同步。\nConnected — progress synced.');
    } catch (e) {
        setSyncStatus('❌ 連接失敗 — 同步碼可能不正確');
        alert('找不到這個同步碼。Sync code not found.\n\n請檢查是否輸入正確。\nPlease check the code is correct.');
    }
}

async function cloudPush(silent) {
    const code = getSyncCode();
    if (!code || cloudBusy) return;

    cloudBusy = true;
    if (!silent) setSyncStatus('⏳ 上傳中… Uploading…');
    try {
        const res = await fetch(`${SYNC_API}/${encodeURIComponent(code)}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(collectAllProfiles())
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        if (!silent) {
            setSyncStatus(`✅ 已上傳 Uploaded<br><span style="color:#60a5fa; font-family: monospace;">${code}</span>`);
            alert('進度已上傳到雲端！\nProgress uploaded to the cloud.');
        }
    } catch (e) {
        if (!silent) {
            setSyncStatus('❌ 上傳失敗 Upload failed');
            alert('上傳失敗，進度已安全存在本機。\nUpload failed — progress is still saved on this device.');
        }
    } finally {
        cloudBusy = false;
    }
}

function cloudPushDebounced() {
    if (!getSyncCode()) return;
    clearTimeout(cloudPushTimer);
    cloudPushTimer = setTimeout(() => cloudPush(true), 1500);
}

async function cloudPull(opts) {
    const silent = opts && opts.silent;
    const code = getSyncCode();
    if (!code) {
        if (!silent) alert('尚未設定同步碼。\nNo sync code set up yet.');
        return;
    }

    if (!silent) setSyncStatus('⏳ 下載中… Downloading…');
    try {
        const res = await fetch(`${SYNC_API}/${encodeURIComponent(code)}`, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const remote = await res.json();
        mergeBundle(remote);

        if (!silent) {
            setSyncStatus(`✅ 已同步 Synced<br><span style="color:#60a5fa; font-family: monospace;">${code}</span>`);
            alert('進度已從雲端更新！\nProgress updated from the cloud.');
        }
    } catch (e) {
        if (!silent) {
            setSyncStatus('❌ 下載失敗 Download failed');
            alert('下載失敗，請檢查網絡。\nDownload failed — please check your connection.');
        }
    }
}

function copySyncCode() {
    const code = getSyncCode();
    if (!code) return;
    if (navigator.clipboard) {
        navigator.clipboard.writeText(code)
            .then(() => alert(`同步碼已複製！Copied:\n\n${code}`))
            .catch(() => alert(`同步碼 Sync code:\n\n${code}`));
    } else {
        alert(`同步碼 Sync code:\n\n${code}`);
    }
}

function disconnectSync() {
    if (!confirm('中斷雲端同步？本機進度會保留。\nDisconnect cloud sync? Local progress is kept.')) return;
    setSyncCode('');
    setSyncStatus('⚪ 未設定 Not set up yet');
}

// Cloud Sync Functions
function exportProgress() {
    // Collect all data for current profile
    const profileData = {
        profile: currentProfile,
        gameState: gameState,
        soundSettings: soundSettings,
        exportDate: new Date().toISOString(),
        version: '1.0'
    };
    
    // Convert to JSON
    const dataStr = JSON.stringify(profileData, null, 2);
    const dataBlob = new Blob([dataStr], { type: 'application/json' });
    
    // Create download link
    const url = URL.createObjectURL(dataBlob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `${currentProfile}_progress_${new Date().toISOString().split('T')[0]}.json`;
    
    // Trigger download
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    
    // Show success message
    alert(`✅ 進度已匯出！
Progress exported!

檔案名稱: ${link.download}

請將此檔案存到 Google Drive 或其他雲端，
在其他設備上匯入即可同步進度！

Save this file to Google Drive or cloud storage,
then import it on other devices to sync!`);
}

function importProgress(input) {
    const file = input.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const importedData = JSON.parse(e.target.result);
            
            // Verify data structure
            if (!importedData.gameState || !importedData.profile) {
                alert('❌ 無效的檔案格式！\nInvalid file format!');
                return;
            }
            
            // Confirm import
            const confirmMsg = `📥 確認匯入進度？
Confirm import progress?

用戶: ${importedData.profile}
Profile: ${importedData.profile}

匯出日期: ${new Date(importedData.exportDate).toLocaleString('zh-HK')}
Export date: ${new Date(importedData.exportDate).toLocaleString('en-US')}

⚠️ 這將覆蓋 ${currentProfile} 的當前進度！
This will overwrite ${currentProfile}'s current progress!`;
            
            if (!confirm(confirmMsg)) {
                input.value = ''; // Clear file input
                return;
            }
            
            // Import the data
            gameState = importedData.gameState;
            if (importedData.soundSettings) {
                soundSettings = importedData.soundSettings;
            }
            
            // Save to localStorage
            saveGameState();
            saveSoundSettings();
            
            // Refresh display
            updateRPGDisplay();
            
            // Clear file input
            input.value = '';
            
            // Close modal and show success
            const modal = document.querySelector('.word-list-modal');
            if (modal) modal.remove();
            
            alert(`✅ 進度匯入成功！
Progress imported successfully!

${currentProfile} 的進度已更新！
${currentProfile}'s progress has been updated!`);
            
        } catch (error) {
            alert(`❌ 匯入失敗！
Import failed!

錯誤: ${error.message}
Error: ${error.message}`);
            input.value = ''; // Clear file input
        }
    };
    
    reader.readAsText(file);
}


// Cantonese Text-to-Speech Function
function speakCantonese(text) {
    // Cancel any ongoing speech
    window.speechSynthesis.cancel();
    
    // Create a new speech utterance
    const utterance = new SpeechSynthesisUtterance(text);
    
    // Try to use Cantonese voice (zh-HK or yue)
    const voices = window.speechSynthesis.getVoices();
    const cantoneseVoice = voices.find(voice => 
        voice.lang === 'zh-HK' || 
        voice.lang === 'yue-HK' ||
        voice.lang.startsWith('zh-HK') ||
        voice.name.includes('Cantonese') ||
        voice.name.includes('粵語') ||
        voice.name.includes('Hong Kong')
    );
    
    if (cantoneseVoice) {
        utterance.voice = cantoneseVoice;
    } else {
        // Fallback to any Chinese voice
        const chineseVoice = voices.find(voice => 
            voice.lang.startsWith('zh') ||
            voice.name.includes('Chinese')
        );
        if (chineseVoice) {
            utterance.voice = chineseVoice;
        }
    }
    
    // Set speech properties
    utterance.lang = 'zh-HK'; // Set to Hong Kong Cantonese
    utterance.rate = 0.9; // Slightly slower for clarity
    utterance.pitch = 1.0;
    utterance.volume = 1.0;
    
    // Speak the text
    window.speechSynthesis.speak(utterance);
}

// Load voices (needed for some browsers)
if (window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = function() {
        window.speechSynthesis.getVoices();
    };
}
